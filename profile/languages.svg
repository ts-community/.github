<svg width="300" height="165" viewBox="0 0 300 165" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Languages used across TS Community repositories</desc>
  <style>
    .header{font:600 18px 'Segoe UI',Ubuntu,Sans-Serif;fill:#A981FF}.name{font:400 11px 'Segoe UI',Ubuntu,Sans-Serif;fill:#C3D1D9}.stagger{opacity:0;animation:fade .35s ease-in-out forwards}.bar{animation:grow .9s ease-in-out forwards;transform-origin:left}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>

  <rect x="0.5" y="0.5" width="299" height="164" rx="5" fill="#0D1117"/>
  <text class="header" x="25" y="35">Most Used Languages</text>

  <g transform="translate(25 55)">
    <rect x="0" y="0" width="250" height="8" rx="4" fill="#30363D"/>
    <rect class="bar" x="0" y="0" width="166.67" height="8" rx="4" fill="#F1E05A"/>
    <rect class="bar" x="166.67" y="0" width="83.33" height="8" rx="4" fill="#3178C6" style="animation-delay:150ms"/>

    <g class="stagger" style="animation-delay:450ms">
      <circle cx="5" cy="32" r="5" fill="#F1E05A"/><text class="name" x="15" y="36">JavaScript · 66.7%</text>
    </g>
    <g class="stagger" style="animation-delay:600ms" transform="translate(0 32)">
      <circle cx="5" cy="32" r="5" fill="#3178C6"/><text class="name" x="15" y="36">TypeScript · 33.3%</text>
    </g>
  </g>
</svg>
