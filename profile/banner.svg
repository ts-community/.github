<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">TS Community Brawl</title>
  <desc id="descId">Banner de TS Community Brawl</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#171233"/>
      <stop offset="1" stop-color="#2A1B5E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#A981FF"/>
      <stop offset="1" stop-color="#5865F2"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <rect y="292" width="1000" height="8" fill="url(#accent)"/>
  <circle cx="880" cy="60" r="90" fill="#8B5CF6" opacity="0.15"/>
  <circle cx="120" cy="250" r="70" fill="#5865F2" opacity="0.15"/>
  <text x="500" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF">TS Community Brawl</text>
  <text x="500" y="185" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#C3D1D9">Comunidad española de Brawl Stars en Discord</text>
  <text x="500" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#A981FF">Clubes · Bots propios · Eventos</text>
</svg>
