<svg width="467" height="165" viewBox="0 0 467 165" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">TS Community's GitHub Stats</title>
  <desc id="descId">GitHub organization statistics</desc>
  <style>
    .header{font:600 18px 'Segoe UI',Ubuntu,Sans-Serif;fill:#A981FF}.stat{font:600 14px 'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif;fill:#C3D1D9}.bold{font-weight:700}.icon{fill:#8F62FF}.stagger{opacity:0;animation:fade .3s ease-in-out forwards}.rim{stroke:#8F62FF;fill:none;stroke-width:6;opacity:.18}.arc{stroke:#A981FF;fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:251;animation:draw 1s ease-out forwards}.dot{fill:#BFA7FF;animation:pulse 2.8s ease-in-out infinite}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:251}to{stroke-dashoffset:63}}@keyframes pulse{0%,100%{opacity:.2;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
  </style>

  <rect x="0.5" y="0.5" width="466" height="164" rx="5" fill="#0D1117"/>

  <text class="header" x="25" y="35">TS Community's GitHub Stats</text>

  <g class="stagger" style="animation-delay:450ms" transform="translate(25 48)">
    <path class="icon" d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z" transform="scale(.9)"/>
    <text class="stat bold" x="25" y="12">Total Stars Earned:</text><text id="stars" class="stat bold" x="224" y="12">7</text>
  </g>

  <g class="stagger" style="animation-delay:600ms" transform="translate(25 70)">
    <path class="icon" d="M7.75 2a.75.75 0 01.75.75v4.5a.75.75 0 01-.75.75H3.5l-2 2V3.5A1.5 1.5 0 013 2h4.75zM3 4v3h4V4H3zm8-2h1.5A2.5 2.5 0 0115 4.5V13l-2.2-2.2H7.75a2.5 2.5 0 01-2.5-2.5v-.8h1.5v.8a1 1 0 001 1h5.67L13.5 10.5v-6A1 1 0 0012.5 3H11V2z" transform="scale(.9)"/>
    <text class="stat bold" x="25" y="12">Total Commits:</text><text id="commits" class="stat bold" x="224" y="12">—</text>
  </g>

  <g class="stagger" style="animation-delay:750ms" transform="translate(25 92)">
    <path class="icon" d="M3 2.5h8.5A2.5 2.5 0 0114 5v4.5A2.5 2.5 0 0111.5 12H8.25L5 14v-2H3A2.5 2.5 0 01.5 9.5V5A2.5 2.5 0 013 2.5z" transform="scale(.8)"/>
    <text class="stat bold" x="25" y="12">Total PRs:</text><text id="prs" class="stat bold" x="224" y="12">0</text>
  </g>

  <g class="stagger" style="animation-delay:900ms" transform="translate(25 114)">
    <circle cx="7" cy="7" r="5.6" fill="none" stroke="#8F62FF" stroke-width="1.8"/><circle cx="7" cy="7" r="1.2" fill="#8F62FF"/>
    <text class="stat bold" x="25" y="12">Total Issues:</text><text id="issues" class="stat bold" x="224" y="12">0</text>
  </g>

  <g class="stagger" style="animation-delay:1050ms" transform="translate(25 136)">
    <path class="icon" d="M3 2h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" transform="scale(.72)"/>
    <text class="stat bold" x="25" y="12">Total Forks:</text><text id="forks" class="stat bold" x="224" y="12">1</text>
  </g>

  <g transform="translate(390 53)">
    <circle class="rim" cx="-10" cy="8" r="40"/>
    <circle class="arc" cx="-10" cy="8" r="40" transform="rotate(-90 -10 8)"/>
    <text x="-10" y="14" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#C3D1D9">TS</text>
    <circle class="dot" cx="-10" cy="-32" r="2.4"/>
  </g>
</svg>
